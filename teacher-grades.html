<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grades - Teacher</title>

    <!-- Shared project CSS -->
    <link rel="stylesheet" href="Style.css">

    <!-- Teacher-specific CSS -->
    <link rel="stylesheet" href="teacher.css">
</head>

<body class="teacher-dashboard">

    <!-- =========================
         NAVIGATION
         ========================= -->

    <nav class="teacher-nav">

        <div class="logo">
            Teacher Portal
        </div>

        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
            ☰
        </button>

        <div class="teacher-nav-links" id="teacherNavLinks">

            <a href="teacher.html">Dashboard</a>
            <a href="teacher-attendance.html">Attendance</a>
            <a href="teacher-grades.html" class="active">Grades</a>

            <div class="teacher-nav-right">

                <span id="teacherName">
                    Teacher
                </span>

                <button onclick="logout()">
                    Logout
                </button>

            </div>

        </div>

    </nav>


    <!-- =========================
         MAIN CONTENT
         ========================= -->

    <main class="teacher-content">

        <h1>
            Grades
        </h1>

        <p class="teacher-subtitle">
            Enter or update marks for each assignment.
        </p>


        <!-- =========================
             COURSE / ASSIGNMENT SELECT
             ========================= -->

        <section class="teacher-section">

            <div class="teacher-info-grid attendance-controls">

                <div>
                    <strong>Course</strong>
                    <select id="courseSelect" onchange="loadGrades()">
                        <option value="Web Development">Web Development</option>
                        <option value="Database Systems">Database Systems</option>
                        <option value="Computer Networks">Computer Networks</option>
                        <option value="Artificial Intelligence">Artificial Intelligence</option>
                    </select>
                </div>

                <div>
                    <strong>Assignment</strong>
                    <select id="assignmentSelect" onchange="loadGrades()">
                        <option value="Assignment 1">Assignment 1</option>
                        <option value="Assignment 2">Assignment 2</option>
                        <option value="Mid-Term">Mid-Term</option>
                        <option value="Final Exam">Final Exam</option>
                    </select>
                </div>

            </div>

        </section>


        <!-- =========================
             GRADES TABLE
             ========================= -->

        <section class="teacher-section">

            <h2>
                Student Marks
            </h2>

            <div class="table-container">

                <table id="gradesTable">

                    <thead>

                        <tr>
                            <th>Student ID</th>
                            <th>Name</th>
                            <th>Marks (out of 100)</th>
                        </tr>

                    </thead>

                    <tbody>
                        <!-- Rows are generated by JavaScript below -->
                    </tbody>

                </table>

            </div>

            <button class="primary-btn save-btn" onclick="saveGrades()">
                Save Grades
            </button>

            <p id="saveMessage" class="save-message"></p>

        </section>

    </main>


    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script>

        // ---- Show logged-in teacher's name ----

        const loggedInUser = localStorage.getItem("loggedInUser");

        if (loggedInUser) {
            document.getElementById("teacherName").textContent = loggedInUser;
        }


        function logout() {

            localStorage.removeItem("loggedInUser");
            localStorage.removeItem("userRole");

            window.location.href = "login.html";

        }


        document.getElementById("menuToggle").addEventListener("click", function () {

            document.getElementById("teacherNavLinks").classList.toggle("open");

        });


        // ---- Mock student list per course ----
        // Replace this with real API data once the backend is connected.
        // Keep this list in sync with teacher-attendance.html.

        const studentsByCourse = {

            "Web Development": [
                { id: "STU001", name: "Abdul" },
                { id: "STU005", name: "Kiran" },
                { id: "STU006", name: "Meena" }
            ],

            "Database Systems": [
                { id: "STU002", name: "Rahul" },
                { id: "STU007", name: "Divya" }
            ],

            "Computer Networks": [
                { id: "STU003", name: "Priya" },
                { id: "STU008", name: "Arjun" }
            ],

            "Artificial Intelligence": [
                { id: "STU004", name: "Sneha" },
                { id: "STU009", name: "Vikram" }
            ]

        };


        // ---- Build the storage key for course + assignment ----

        function getStorageKey() {

            const course = document.getElementById("courseSelect").value;
            const assignment = document.getElementById("assignmentSelect").value;

            return "grades_" + course + "_" + assignment;

        }


        // ---- Render the table for the selected course + assignment ----

        function loadGrades() {

            const course = document.getElementById("courseSelect").value;
            const students = studentsByCourse[course] || [];

            const saved = JSON.parse(
                localStorage.getItem(getStorageKey()) || "{}"
            );

            const tbody = document.querySelector("#gradesTable tbody");
            tbody.innerHTML = "";

            students.forEach(function (student) {

                const mark = saved[student.id] !== undefined ? saved[student.id] : "";

                const row = document.createElement("tr");

                row.innerHTML =
                    "<td>" + student.id + "</td>" +
                    "<td>" + student.name + "</td>" +
                    "<td>" +
                        "<input type='number' min='0' max='100' " +
                        "data-student-id='" + student.id + "' value='" + mark + "'>" +
                    "</td>";

                tbody.appendChild(row);

            });

        }


        // ---- Save grades for the selected course + assignment ----

        function saveGrades() {

            const inputs = document.querySelectorAll("#gradesTable input[data-student-id]");
            const data = {};

            inputs.forEach(function (input) {
                data[input.getAttribute("data-student-id")] = input.value;
            });

            localStorage.setItem(getStorageKey(), JSON.stringify(data));

            const message = document.getElementById("saveMessage");
            message.textContent = "Grades saved.";

            setTimeout(function () {
                message.textContent = "";
            }, 2500);

        }


        // ---- Initial load ----

        loadGrades();

    </script>

</body>

</html>
