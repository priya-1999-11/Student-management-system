<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mark Attendance - Teacher</title>

    <!-- Shared project CSS -->
    <link rel="stylesheet" href="Style.css">

    <!-- Teacher-specific CSS -->
    <link rel="stylesheet" href="teacher.css">
</head>

<body class="teacher-dashboard">

    <!-- =========================
         NAVIGATION
         ========================= -->

    <nav class="teacher-nav">

        <div class="logo">
            Teacher Portal
        </div>

        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
            ☰
        </button>

        <div class="teacher-nav-links" id="teacherNavLinks">

            <a href="teacher.html">Dashboard</a>
            <a href="teacher-attendance.html" class="active">Attendance</a>
            <a href="teacher-grades.html">Grades</a>

            <div class="teacher-nav-right">

                <span id="teacherName">
                    Teacher
                </span>

                <button onclick="logout()">
                    Logout
                </button>

            </div>

        </div>

    </nav>


    <!-- =========================
         MAIN CONTENT
         ========================= -->

    <main class="teacher-content">

        <h1>
            Mark Attendance
        </h1>

        <p class="teacher-subtitle">
            Select a course and mark today's attendance for each student.
        </p>


        <!-- =========================
             COURSE SELECT + DATE
             ========================= -->

        <section class="teacher-section">

            <div class="teacher-info-grid attendance-controls">

                <div>
                    <strong>Course</strong>
                    <select id="courseSelect" onchange="loadAttendance()">
                        <option value="Web Development">Web Development</option>
                        <option value="Database Systems">Database Systems</option>
                        <option value="Computer Networks">Computer Networks</option>
                        <option value="Artificial Intelligence">Artificial Intelligence</option>
                    </select>
                </div>

                <div>
                    <strong>Date</strong>
                    <input type="date" id="attendanceDate" onchange="loadAttendance()">
                </div>

            </div>

        </section>


        <!-- =========================
             ATTENDANCE TABLE
             ========================= -->

        <section class="teacher-section">

            <h2>
                Students
            </h2>

            <div class="table-container">

                <table id="attendanceTable">

                    <thead>

                        <tr>
                            <th>Student ID</th>
                            <th>Name</th>
                            <th>Status</th>
                        </tr>

                    </thead>

                    <tbody>
                        <!-- Rows are generated by JavaScript below -->
                    </tbody>

                </table>

            </div>

            <button class="primary-btn save-btn" onclick="saveAttendance()">
                Save Attendance
            </button>

            <p id="saveMessage" class="save-message"></p>

        </section>

    </main>


    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script>

        // ---- Show logged-in teacher's name ----

        const loggedInUser = localStorage.getItem("loggedInUser");

        if (loggedInUser) {
            document.getElementById("teacherName").textContent = loggedInUser;
        }


        function logout() {

            localStorage.removeItem("loggedInUser");
            localStorage.removeItem("userRole");

            window.location.href = "login.html";

        }


        document.getElementById("menuToggle").addEventListener("click", function () {

            document.getElementById("teacherNavLinks").classList.toggle("open");

        });


        // ---- Mock student list per course ----
        // Replace this with real API data once the backend is connected.

        const studentsByCourse = {

            "Web Development": [
                { id: "STU001", name: "Abdul" },
                { id: "STU005", name: "Kiran" },
                { id: "STU006", name: "Meena" }
            ],

            "Database Systems": [
                { id: "STU002", name: "Rahul" },
                { id: "STU007", name: "Divya" }
            ],

            "Computer Networks": [
                { id: "STU003", name: "Priya" },
                { id: "STU008", name: "Arjun" }
            ],

            "Artificial Intelligence": [
                { id: "STU004", name: "Sneha" },
                { id: "STU009", name: "Vikram" }
            ]

        };


        // ---- Build the storage key for course + date ----

        function getStorageKey() {

            const course = document.getElementById("courseSelect").value;
            const date = document.getElementById("attendanceDate").value;

            return "attendance_" + course + "_" + date;

        }


        // ---- Render the table for the selected course + date ----

        function loadAttendance() {

            const course = document.getElementById("courseSelect").value;
            const students = studentsByCourse[course] || [];

            const dateInput = document.getElementById("attendanceDate");

            if (!dateInput.value) {
                dateInput.value = new Date().toISOString().split("T")[0];
            }

            const saved = JSON.parse(
                localStorage.getItem(getStorageKey()) || "{}"
            );

            const tbody = document.querySelector("#attendanceTable tbody");
            tbody.innerHTML = "";

            students.forEach(function (student) {

                const status = saved[student.id] || "Present";

                const row = document.createElement("tr");

                row.innerHTML =
                    "<td>" + student.id + "</td>" +
                    "<td>" + student.name + "</td>" +
                    "<td>" +
                        "<select data-student-id='" + student.id + "'>" +
                            "<option value='Present'" + (status === "Present" ? " selected" : "") + ">Present</option>" +
                            "<option value='Absent'" + (status === "Absent" ? " selected" : "") + ">Absent</option>" +
                            "<option value='Late'" + (status === "Late" ? " selected" : "") + ">Late</option>" +
                        "</select>" +
                    "</td>";

                tbody.appendChild(row);

            });

        }


        // ---- Save attendance for the selected course + date ----

        function saveAttendance() {

            const selects = document.querySelectorAll("#attendanceTable select[data-student-id]");
            const data = {};

            selects.forEach(function (select) {
                data[select.getAttribute("data-student-id")] = select.value;
            });

            localStorage.setItem(getStorageKey(), JSON.stringify(data));

            const message = document.getElementById("saveMessage");
            message.textContent = "Attendance saved.";

            setTimeout(function () {
                message.textContent = "";
            }, 2500);

        }


        // ---- Initial load ----

        loadAttendance();

    </script>

</body>

</html>
